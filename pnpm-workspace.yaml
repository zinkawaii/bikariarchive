minimumReleaseAge: 0
trustPolicy: no-downgrade
shamefullyHoist: true
shellEmulator: true

packages:
  - packages/*

overrides:
  "@nuxt/cli": npm:@nuxt/cli-nightly@^4.0.0-2610090719-f2e6cde
  # @nuxt/icon > @nuxt/devtools-kit@^3.4.2
  # nuxtseo-shared > @nuxt/devtools-kit@4.0.0-alpha.7
  "@nuxt/devtools-kit": &nuxt/devtools ^4.0.0-beta.4
  "@nuxt/kit": npm:@nuxt/kit-nightly@^5.0.0-2610111729-78f43dd
  "@nuxt/schema": npm:@nuxt/schema-nightly@^5.0.0-2610111729-78f43dd
  # @nuxtjs/robots, nuxt-auth-utils, nuxt-site-config > h3@^1.15.11
  h3: ^2.0.2
  # micromark-extension-math > katex@^0.16.0
  katex: ^0.19.0
  nitro: npm:nitro-nightly@^3.0.1-20261008-023340-cef53050
  nuxt: npm:nuxt-nightly@^5.0.0-2610111729-78f43dd
  # vite-node > obug@^2.1.1
  obug: ^3.0.0
  # @nuxtjs/sitemap, nuxt-auth-utils, nuxtseo-shared > ofetch@^1.5.1
  ofetch: ^2.0.0-alpha.3
  # @nuxtjs/sitemap > oxc-parser@^0.141.0
  oxc-parser: link:???
  typescript: npm:typescript-native-bridge@^6.0.3-bridge.18.tsgo.7.0.2
  # @nuxt/devtools > unstorage@^1.17.5
  unstorage: ^2.0.0-alpha.10

patchedDependencies:
  "@nuxt/icon": patches/@nuxt__icon.patch
  "@nuxtjs/sitemap": patches/@nuxtjs__sitemap.patch
  mdast-util-to-hast: patches/mdast-util-to-hast.patch
  nuxt-auth-utils: patches/nuxt-auth-utils.patch

catalogs:
  build:
    typescript: ?=6.0.3
  content:
    mdast-util-to-string: ^4.0.0
    remark-breaks: ^4.0.0
    remark-rehype: ^11.1.2
    satorigear: ^0.0.9
    unified: ^11.0.5
    unist-util-visit: ^5.1.0
  database:
    mongoose: ^9.11.1
  iconify:
    "@iconify-json/fa7-solid": ^1.2.5
  lint:
    "@zinkawaii/eslint-config": &zin/eslint ^0.5.4
    "@zinkawaii/eslint-config-css": *zin/eslint
    eslint: ^10.12.0
  nuxt:
    "@bikariya/image-viewer": &bikariya ^0.0.8
    "@bikariya/modals": *bikariya
    "@bikariya/shiki": *bikariya
    "@nuxt/devtools": *nuxt/devtools
    "@nuxt/icon": ^2.5.1
    "@nuxtjs/robots": ^6.2.4
    "@nuxtjs/sitemap": ^8.6.1
    "@pinia/nuxt": ^1.0.2
    "@vueuse/nuxt": &vueuse ^15.0.0
    nuxt: ^4.6.1
    nuxt-auth-utils: ^0.5.31
    nuxt-schema-org: ^6.4.3
    nuxt-seo-utils: ^8.6.1
    nuxt-site-config: ^4.2.3
  types:
