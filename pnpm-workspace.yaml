minimumReleaseAge: 0
shamefullyHoist: true
shellEmulator: true
trustPolicy: no-downgrade

packages:
  - content
  - packages/*

define:
  - &bikariya ^0.0.8
  - &nuxt ^4.5.1
  - &shiki ^4.4.1
  - &vls ^3.3.9
  - &volar 2.4.28
  - &vueuse ^14.4.0
  - &zin/eslint ^0.5.2

overrides:
  # @nuxt/fonts, @nuxt/icon > @nuxt/devtools-kit@^3.3.1
  # nuxtseo-shared > @nuxt/devtools-kit@4.0.0-alpha.7
  "@nuxt/devtools-kit": ^4.0.0-alpha.10
  "@nuxt/kit": npm:@nuxt/kit-nightly@^5.0.0-29763987.a48dcbf9
  "@nuxt/schema": npm:@nuxt/schema-nightly@^5.0.0-29763987.a48dcbf9
  # fontless > esbuild@0.27.0
  esbuild: ^0.28.1
  # @nuxt/fonts, @nuxt/image, @nuxtjs/robots, nuxt-site-config > h3@1.15.11
  h3: ^2.0.1-rc.26
  # micromark-extension-math > katex@0.16.0
  katex: ^0.18.1
  nitro: npm:nitro-nightly@^3.0.1-20260731-205209-52abde8a
  nuxt: npm:nuxt-nightly@^5.0.0-29763987.a48dcbf9
  # @nuxt/fonts, @nuxtjs/sitemap, nuxtseo-shared, unifont > ofetch@1.5.1
  ofetch: ^2.0.0-alpha.3
  typescript: npm:typescript-native-bridge@^6.0.3-bridge.9.tsgo.7.0.2
  # @nuxt/devtools, @nuxt/fonts, fontless > unstorage@1.17.5
  unstorage: ^2.0.0-alpha.7

patchedDependencies:
  "@nuxt/fonts": patches/@nuxt__fonts.patch
  "@nuxtjs/robots": patches/@nuxtjs__robots.patch
  "@pinia/nuxt": patches/@pinia__nuxt.patch
  mdast-util-to-hast: patches/mdast-util-to-hast.patch
  nuxt-auth-utils: patches/nuxt-auth-utils.patch
  remark-mdc: patches/remark-mdc.patch

catalogs:
  build:
    typescript: ?=6.0.3
  content:
    kerria: ^0.5.0
    mdast-util-gfm-footnote: ^2.1.0
    mdast-util-gfm-strikethrough: ^2.0.0
    mdast-util-to-string: ^4.0.0
    micromark-extension-gfm-footnote: ^2.1.0
    micromark-extension-gfm-strikethrough: ^2.1.0
    micromark-util-symbol: ^2.0.1
    remark-breaks: ^4.0.0
    remark-frontmatter: ^5.0.0
    remark-math: ^6.0.0
    remark-mdc: ^3.11.1
    remark-parse: ^11.0.0
    remark-rehype: ^11.1.2
    unified: ^11.0.5
    unist-util-visit: ^5.1.0
  database:
    mongoose: ^9.9.1
  iconify:
    "@iconify-json/fa7-solid": ^1.2.5
  lint:
    "@zinkawaii/eslint-config": *zin/eslint
    "@zinkawaii/eslint-config-css": *zin/eslint
    eslint: ^10.8.0
  nuxt:
    "@bikariya/image-viewer": *bikariya
    "@bikariya/modals": *bikariya
    "@bikariya/shiki": *bikariya
    "@nuxt/fonts": ^0.14.0
    "@nuxt/icon": ^2.4.1
    "@nuxt/image": ^2.1.0
    "@nuxt/kit": *nuxt
    "@nuxt/schema": *nuxt
    "@nuxtjs/robots": ^6.1.3
    "@nuxtjs/sitemap": ^8.3.2
    "@pinia/nuxt": ^1.0.1
    "@vueuse/nuxt": *vueuse
    nuxt: *nuxt
    nuxt-auth-utils: ^0.5.29
    nuxt-schema-org: ^6.2.8
    nuxt-seo-utils: ^8.3.3
    nuxt-site-config: ^4.1.4
  test:
    vitest: ^5.0.0-beta.7
  types:
    "@types/node": ^26.1.2
    "@zinkawaii/tsconfig": ^0.1.0
  utils:
    "@clack/prompts": ^1.7.0
    "@shikijs/transformers": *shiki
    arktype: ^2.2.3
    aws4fetch: ^1.0.20
    bgmt: ^0.3.1
    chokidar: ^5.0.0
    consola: ^3.4.2
    crypto-es: ^3.1.3
    defu: ^6.1.7
    entities: ^8.0.0
    github-slugger: ^2.0.0
    katex: ^0.18.1
    knitwork: ^1.3.0
    mrmime: ^2.0.1
    pathe: ^2.0.3
    plain-shiki: ^0.3.2
    propathy: ^0.2.1
    shiki: *shiki
    temporal-polyfill: ^1.0.3
    tinyexec: ^1.3.0
    tinyglobby: ^0.2.17
    ufo: ^1.6.4
    unemail: ^0.5.0
    uqr: ^0.1.3
    yaml: ^2.9.0
    zfeed: ^0.2.4
  volar:
    "@volar/language-core": *volar
    "@volar/typescript": *volar
  vue:
    "@vueuse/core": *vueuse
    "@vueuse/router": *vueuse
    pinia: ^4.0.2
    pinia-plugin-persistedstate: ^4.7.1
    vue: ^3.5.40
    vue-component-type-helpers: *vls
    vue-router: ^5.2.0
    vue-tsc: *vls

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
