minimumReleaseAge: 0

trustPolicy: no-downgrade
trustPolicyExclude:
  - seroval@1.7.2

shamefullyHoist: true
shellEmulator: true

packages:
  - packages/*

overrides:
  "@nuxt/cli": npm:@nuxt/cli-nightly@^4.0.0-2610090719-f2e6cde
  # @nuxt/icon > @nuxt/devtools-kit@^3.4.2
  "@nuxt/devtools-kit": &nuxt/devtools ^4.0.0-beta.7
  "@nuxt/kit": npm:@nuxt/kit-nightly@^5.0.0-2610270115-58d7824
  "@nuxt/schema": npm:@nuxt/schema-nightly@^5.0.0-2610270115-58d7824
  # @vue/language-core > @vue/compiler-dom@^3.5.0
  "@vue/compiler-dom": &vue ^3.6.0-rc.13
  # @vue-macros/common > @vue/compiler-sfc@^3.5.22
  "@vue/compiler-sfc": *vue
  # pinia, vue-router > @vue/devtools-api@^8.2.1
  "@vue/devtools-api": ^9.0.0-rc.2
  # @vue/language-core > @vue/shared@^3.5.0
  "@vue/shared": *vue
  # nuxt-auth-utils > h3@^1.15.11
  h3: ^2.0.8
  nitro: npm:nitro-nightly@^3.0.1-20261027-023028-e1743f2e
  nuxt: npm:nuxt-nightly@^5.0.0-2610270115-58d7824
  # @nuxtjs/sitemap, nuxt-auth-utils, nuxtseo-shared > ofetch@^1.5.1
  ofetch: ^2.0.0-alpha.3
  # @nuxtjs/sitemap > oxc-parser@^0.141.0
  oxc-parser: "-"
  typescript: npm:typescript-native-bridge@^6.0.3-bridge.19.tsgo.7.0.2
  # @nuxt/vite-builder > vite-plugin-checker@^0.14.5
  vite-plugin-checker: "-"
  vue: *vue

patchedDependencies:
  "@eslint/css-tree": patches/@eslint__css-tree.patch
  "@nuxtjs/sitemap": patches/@nuxtjs__sitemap.patch
  mdast-util-to-hast: patches/mdast-util-to-hast.patch

catalogs:
  build:
    typescript: ?=6.0.3
  content:
    mdast-util-to-string: ^4.0.0
    remark-breaks: ^4.0.0
    remark-rehype: ^11.1.2
    satorigear: ^0.0.9
    unified: ^11.0.5
    unist-util-visit: ^5.2.0
  database:
    mongoose: ^9.11.4
  iconify:
    "@iconify-json/fa7-solid": ^1.2.5
  lint:
    "@zinkawaii/eslint-config": ^0.5.5
    "@zinkawaii/eslint-config-css": ^0.5.4
    eslint: ^10.13.0
  nuxt:
    "@bikariya/image-viewer": &bikariya ^0.0.8
    "@bikariya/modals": *bikariya
    "@bikariya/shiki": *bikariya
    "@nuxt/devtools": *nuxt/devtools
    "@nuxt/icon": ^2.6.1
    "@nuxtjs/robots": ^7.0.2
    "@nuxtjs/sitemap": ^9.1.0
    "@pinia/nuxt": ^1.0.3
    "@vueuse/nuxt": &vueuse ^15.0.0
    nuxt: ^4.6.3
    nuxt-auth-utils: ^0.5.32
    nuxt-schema-org: ^7.0.1
    nuxt-seo-utils: ^9.0.1
    nuxt-site-config: ^5.0.3
  types:
    "@types/node": ^26.6.5
    "@zinkawaii/tsconfig": ^0.1.0
  utils:
    "@clack/prompts": ^1.8.1
    "@shikijs/transformers": &shiki ^4.5.0
    alien-signals: ^3.2.1
    arktype: ^2.2.9
    aws4fetch: ^1.0.20
    bgmt: ^0.3.2
    chokidar: ^5.0.0
    consola: ^3.4.2
    db0: ^0.4.1
    defu: ^6.1.7
    entities: ^8.1.0
    github-slugger: ^2.0.0
    katex: ^0.19.1
    mrmime: ^2.0.1
    ocache: ^0.3.1
    pathe: ^2.0.3
    plain-shiki: ^0.3.2
    propathy: ^0.2.1
    shiki: *shiki
    temporal-polyfill: ^1.0.6
    tinyglobby: ^0.2.17
    ufo: ^1.6.4
    unemail: ^0.7.0
    unstorage: ^2.0.0-beta.0
    uqr: ^0.1.3
    yaml: ^2.9.1
    zfeed: ^0.2.4
  volar:
    "@volar/language-core": &volar 2.4.28
    "@volar/typescript": *volar
  vue:
    "@vueuse/core": *vueuse
    "@vueuse/router": *vueuse
