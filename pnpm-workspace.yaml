    alien-signals: ^3.2.1
    arktype: ^2.2.8
    aws4fetch: ^1.0.20
    bgmt: ^0.3.1
    chokidar: ^5.0.0
    consola: ^3.4.2
    db0: ^0.4.1
    defu: ^6.1.7
    entities: ^8.1.0
    github-slugger: ^2.0.0
    katex: ^0.19.0
    mrmime: ^2.0.1
    pathe: ^2.0.3
    plain-shiki: ^0.3.2
    propathy: ^0.2.1
    shiki: *shiki
    temporal-polyfill: ^1.0.5
    tinyexec: ^1.3.1
    tinyglobby: ^0.2.17
    ufo: ^1.6.4
    unemail: ^0.7.0
    unstorage: ^1.17.5
    uqr: ^0.1.3
    yaml: ^2.9.1
    zfeed: ^0.2.4
  volar:
    "@volar/language-core": &volar 2.4.28
    "@volar/typescript": *volar
  vue:
